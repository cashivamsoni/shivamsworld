<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ICAI Portal Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%230a1f44' stroke='%23c9a84c' stroke-width='5'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='30' fill='%23c9a84c'%3ECA%3C/text%3E%3C/svg%3E"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy: #0a1f44;
      --navy-light: #122554;
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --bg: #fdf8f0;
      --card: #ffffff;
      --text-muted: #6b7a99;
      --url: #9aa3b8;
      --btn-bg: #0a1f44;
      --btn-text: #ffffff;
      --shadow: 0 8px 32px rgba(10,31,68,0.13);
      --shadow-hover: 0 16px 48px rgba(10,31,68,0.22);
    }
    :root[data-theme="dark"] {
      --bg: #070f22;
      --card: #0e1b3a;
      --text-muted: #8f9dc0;
      --url: #7f8cab;
      --btn-bg: #c9a84c;
      --btn-text: #0a1f44;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --shadow-hover: 0 16px 48px rgba(0,0,0,0.6);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(201,168,76,0.10) 0%, transparent 50%),
        radial-gradient(circle at 85% 80%, rgba(10,31,68,0.07) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    /* Theme toggle */
    .theme-toggle {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      background: var(--card);
      color: var(--gold);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: transform 0.2s;
    }
    .theme-toggle:hover { transform: rotate(20deg); }
    .theme-toggle svg { width: 18px; height: 18px; }

    header { text-align: center; margin-bottom: 36px; }

    .logo-emblem {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      background: var(--navy);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid var(--gold);
      box-shadow: 0 4px 16px rgba(10,31,68,0.25), 0 0 0 5px rgba(201,168,76,0.12);
    }
    .logo-emblem span {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 5vw, 42px);
      color: var(--navy);
      letter-spacing: -0.5px;
      line-height: 1.15;
    }
    :root[data-theme="dark"] h1 { color: #f3ecda; }
    h1 span { color: var(--gold); }

    .subtitle {
      margin-top: 10px;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 300;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .divider {
      width: 60px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 16px auto 0;
    }

    /* Search */
    .search-wrap {
      max-width: 420px;
      margin: 0 auto 36px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      color: var(--gold);
      pointer-events: none;
    }
    #search {
      width: 100%;
      font: inherit;
      font-size: 14px;
      padding: 13px 44px 13px 42px;
      border-radius: 999px;
      border: 1px solid rgba(201,168,76,0.35);
      background: var(--card);
      color: var(--navy);
      box-shadow: var(--shadow);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    :root[data-theme="dark"] #search { color: #f3ecda; }
    #search:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.25); }
    .kbd {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--url);
      border: 1px solid rgba(201,168,76,0.35);
      border-radius: 5px;
      padding: 1px 7px;
      pointer-events: none;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(201,168,76,0.18);
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s;
      animation: fadeUp 0.5s ease both;
    }
    .card:hover, .card:focus-within {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
      border-color: var(--gold);
    }
    .card.hidden { display: none; }

    .card-inner { display: flex; flex-direction: column; height: 100%; }

    .card-top {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      padding: 18px 20px 16px;
      position: relative;
      overflow: hidden;
      min-height: 98px;
    }
    .card-top::after {
      content: '';
      position: absolute; right: -20px; top: -20px;
      width: 90px; height: 90px;
      background: rgba(201,168,76,0.10);
      border-radius: 50%;
    }
    .card-number {
      font-size: 10px; font-weight: 500;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
      opacity: 0.85;
      display: flex; align-items: center; justify-content: space-between;
    }
    .key {
      font-size: 10px;
      border: 1px solid rgba(201,168,76,0.5);
      border-radius: 4px;
      padding: 0 6px;
      letter-spacing: 0;
      position: relative; z-index: 1;
    }
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      color: #fff;
      line-height: 1.3;
      position: relative; z-index: 1;
    }

    .card-body {
      padding: 16px 20px 20px;
      flex: 1;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .card-url {
      font-size: 11px; color: var(--url);
      margin-bottom: 14px;
      word-break: break-all; line-height: 1.5;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      align-self: flex-start;
      background: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      font-size: 13px; font-weight: 500;
      padding: 10px 20px;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s, gap 0.2s;
      letter-spacing: 0.3px;
    }
    .btn:hover, .btn:focus-visible { background: var(--gold); color: var(--navy); gap: 12px; outline: none; }
    .btn:focus-visible { box-shadow: 0 0 0 3px rgba(201,168,76,0.45); }
    .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    .empty {
      display: none;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 24px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      margin-top: 52px;
      font-size: 12px;
      color: var(--url);
      letter-spacing: 0.5px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
      .kbd, footer .hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .card, .btn, .theme-toggle { transition: none; }
    }
  </style>
</head>
<body>
<div class="container">

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>

  <header>
    <div class="logo-emblem"><span>ICAI</span></div>
    <h1>ICAI <span>Portal</span> Dashboard</h1>
    <p class="subtitle">Quick Access to All ICAI Portals</p>
    <div class="divider"></div>
  </header>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="search" placeholder="Search portals…" autocomplete="off" aria-label="Search portals"/>
    <span class="kbd">/</span>
  </div>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">No portal matches your search.</p>

  <footer>
    ICAI Portal Dashboard<br/>
    <span class="hint">Press <b>1–9</b> or <b>0</b> (for 10) to open a portal &nbsp;·&nbsp; <b>/</b> to search</span>
  </footer>

</div>

<script>
  /* =============================================
     HOW TO ADD / EDIT A BUTTON:
     Add one line to the PORTALS list below:
     { title: "Name", url: "https://link", display: "short-link-text" },
     The order here is the order on the page.
     ============================================= */
  const PORTALS = [
    { title: "ICAI SSP Login",                  url: "https://eservices.icai.org/",                                                           display: "eservices.icai.org" },
    { title: "ICAI BoS Main Page",              url: "https://boslive.icai.org/",                                                             display: "boslive.icai.org" },
    { title: "ICAI E-Diary",                    url: "https://eservices.icai.org//per/g21/pub/1666/SelfServices/templates/EdiaryLogin12092025024218/Ediary%20Login%20Folder/ICAI%20Ediary%20Login512092025024240.html", display: "eservices.icai.org — E-Diary Login" },
    { title: "Study Material (English) — Final",url: "https://boslive.icai.org/study_material_new_paper_details.php?c=final&language=English", display: "boslive.icai.org — Final / English" },
    { title: "SPOM Study Material",             url: "https://www.icai.org/post/self-paced-online-modules-nset",                              display: "icai.org/post/self-paced-online-modules-nset" },
    { title: "SPOM Learning Page",              url: "https://lms.icai.org/login",                                            display: "https://lms.icai.org/login" },
    { title: "SPMT Page",                       url: "https://spmt.icai.org/ICAI/LoginAction_input.action",                                   display: "spmt.icai.org" },
    { title: "ICAI Announcements",              url: "https://www.icai.org/category/announcements",                                           display: "icai.org/category/announcements" },
    { title: "ICAI Online Registration Login",  url: "https://www.icaionlineregistration.org/admin_module/login.aspx",                        display: "icaionlineregistration.org/admin_module/login" },
    { title: "Online Registration — Launch Batch Details", url: "https://www.icaionlineregistration.org/launchbatchdetail.aspx",              display: "icaionlineregistration.org/launchbatchdetail" },
    { title: "ICAI Results",                    url: "https://caresults.icai.org/caresult/",                                                  display: "caresults.icai.org/caresult" },
    { title: "BoS Activities Login",            url: "https://bosactivities.icai.org/#/login",                                                display: "bosactivities.icai.org/#/login" }
  ];

  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
  const grid = document.getElementById('grid');
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

  PORTALS.forEach((p, i) => {
    const n = i + 1;
    const key = n === 10 ? '0' : (n < 10 ? String(n) : '');
    const keyBadge = key ? '<span class="key" title="Keyboard shortcut">' + key + '</span>' : '';
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (0.05 * n) + 's';
    card.dataset.search = (p.title + ' ' + p.display).toLowerCase();
    card.innerHTML =
      '<div class="card-inner">' +
        '<div class="card-top">' +
          '<div class="card-number"><span>Portal ' + String(n).padStart(2, '0') + '</span>' + keyBadge + '</div>' +
          '<div class="card-title">' + esc(p.title) + '</div>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="card-url">' + esc(p.display) + '</div>' +
          '<a href="' + p.url + '" target="_blank" rel="noopener" class="btn">Open Portal ' + ARROW + '</a>' +
        '</div>' +
      '</div>';
    grid.appendChild(card);
  });

  /* Search */
  const search = document.getElementById('search');
  const empty = document.getElementById('empty');
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    let shown = 0;
    grid.querySelectorAll('.card').forEach(c => {
      const match = !q || c.dataset.search.includes(q);
      c.classList.toggle('hidden', !match);
      if (match) shown++;
    });
    empty.style.display = shown ? 'none' : 'block';
  });
  search.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const first = grid.querySelector('.card:not(.hidden) .btn');
      if (first) window.open(first.href, '_blank', 'noopener');
    }
    if (e.key === 'Escape') { search.value = ''; search.dispatchEvent(new Event('input')); search.blur(); }
  });

  /* Keyboard shortcuts */
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.activeElement === search) return;
    if (e.key === '/') { e.preventDefault(); search.focus(); return; }
    if (/^[0-9]$/.test(e.key)) {
      const idx = e.key === '0' ? 9 : parseInt(e.key, 10) - 1;
      if (PORTALS[idx]) window.open(PORTALS[idx].url, '_blank', 'noopener');
    }
  });

  /* Dark mode (remembered; falls back silently if storage is blocked) */
  const root = document.documentElement;
  let saved = null;
  try { saved = localStorage.getItem('icai-theme'); } catch (e) {}
  const prefersDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('icai-theme', next); } catch (e) {}
  });
</script>
</body>
</html>

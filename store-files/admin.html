<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders Admin - Shivam's World</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#6f00ff" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

    <link rel="stylesheet" href="../style.7f2a1c.css" />
    <link rel="stylesheet" href="store.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>

    <header>
      <div id="headerBrand">
        <div id="headerlogo">
          <img src="https://yt3.ggpht.com/BhLXKi7aTZ4-IIw_9G3srLqh-QsE4uBxIAfIjAiZ4VEeb2DhURWjfqJUlQLRfMwapt329oed=s600-c-k-c0x00ffffff-no-rj-rp-mo" alt="Shivam's World Logo" width="55px" height="55px" style="border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px #fff;">
        </div>
        <h1>Orders Admin</h1>
      </div>
      <button id="storeThemeToggle" class="store-theme-btn" aria-label="Switch to dark mode" title="Switch to dark mode"><i class="fa fa-moon-o" aria-hidden="true"></i></button>
      <button id="signOutBtn" class="btn-inline admin-signout" hidden>Sign out</button>
    </header>

    <main class="container">

      <!-- ===== SIGN IN ===== -->
      <section id="authView" class="card auth-card" hidden>
        <h1>Sign in</h1>
        <p id="authMsg" class="small auth-msg">Sign in with the admin Google account to see and manage store orders.</p>
        <button id="signInBtn" class="btn-inline" type="button"><i class="fa fa-google" aria-hidden="true"></i>&nbsp; Sign in with Google</button>
        <p id="authError" class="form-error" role="alert" hidden></p>
        <p class="small-note"><a href="../store.html">Back to the store</a></p>
      </section>

      <!-- ===== ORDERS ===== -->
      <section id="appView" hidden>
        <div class="card toolbar">
          <input id="searchInput" type="search" placeholder="Search by order ID, name, phone or UTR" aria-label="Search orders">
          <div id="filters" class="filters" role="group" aria-label="Filter by status"></div>
        </div>

        <p id="loadError" class="form-error" role="alert" hidden></p>
        <p id="emptyMsg" class="empty-msg" hidden></p>
        <div id="ordersList" class="orders-list"></div>
      </section>

    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="ui.js"></script>
    <script type="module" src="admin.js"></script>
  </body>
</html>
